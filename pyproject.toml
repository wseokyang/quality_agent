[tool.pytest.ini_options]
pythonpath = ["api", "openwebui"]
testpaths = ["tests", "scripts/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These standalone tests bootstrap local script/package directories before imports.
"tests/test_bridge.py" = ["E402"]
"scripts/tests/test_operational_scripts.py" = ["E402"]
