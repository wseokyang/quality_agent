[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-openwebui-bridge"
version = "0.1.0"
description = "Trusted Open WebUI bridge for the quality work API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyJWT>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quality_bridge*"]
